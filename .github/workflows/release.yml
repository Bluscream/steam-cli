name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.6.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Resolve version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "bare=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor -race ./...

      - name: Build release binaries
        run: VERSION="${{ steps.v.outputs.bare }}" ./scripts/build.sh

      - name: Build AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 desktop-file-utils
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # The runner has no FUSE for nested AppImages; extract and run directly.
          cd /tmp && appimagetool --appimage-extract >/dev/null 2>&1 || true
          if [ -d /tmp/squashfs-root ]; then
            printf '#!/bin/sh\nexec /tmp/squashfs-root/AppRun "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
            sudo chmod +x /usr/local/bin/appimagetool
          fi
          cd "$GITHUB_WORKSPACE"
          ./scripts/build-appimage.sh "${{ steps.v.outputs.bare }}" x86_64

      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum steamcli-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            dist/steamcli-*
            dist/SHA256SUMS
            dist/THIRD_PARTY_LICENSES.txt

  pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
